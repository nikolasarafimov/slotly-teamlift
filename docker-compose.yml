services:
  postgres:
    image: postgres:17-alpine
    container_name: slotly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly_dev_password
      POSTGRES_DB: slotly

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - slotly_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotly -d slotly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slotly_pgdata: